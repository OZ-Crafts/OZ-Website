<title>OZ — Coming Soon</title>

<style>
  :root{
    --marigold:#F5A623;
    --denim:#3A5A9B;
    --coral:#E8623D;
    --mint:#DCEEE6;
    --paper:#FBF8F2;
    --ink:#5E5A50;
  }
  *{box-sizing:border-box;}
  html{background:var(--paper);color-scheme:light;}
  body{
    margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    text-align:center;
  }
  .wrap{max-width:480px;}
  img.logo{width:140px;height:auto;margin-bottom:8px;}
  h1{
    font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px;
    color:var(--denim);margin:12px 0 6px;letter-spacing:-0.01em;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--mint);color:#2C4577;
    padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;
    transform:rotate(-2deg);margin-bottom:6px;
  }
  p.lede{font-size:16px;color:var(--ink);margin:10px 0 26px;line-height:1.5;}
  .btn{
    display:inline-block;background:var(--coral);color:#fff;text-decoration:none;
    padding:13px 26px;border-radius:12px;font-weight:700;font-size:15px;
    box-shadow:0 4px 0 #C24E2F;
  }
  .dots{margin-top:30px;display:flex;gap:8px;justify-content:center;}
  .dots span{width:8px;height:8px;border-radius:50%;background:var(--marigold);opacity:0.5;}
  .dots span:nth-child(2){background:var(--denim);opacity:0.5;}
  .dots span:nth-child(3){background:var(--coral);opacity:0.5;}
</style>
